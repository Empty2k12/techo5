name: Build release binaries

# Builds echod-arm and echod-arm-dot on GitHub's runners from a tagged commit, and attests that the
# published binaries were built from that exact source — so anyone can verify a release matches the
# repo without trusting the maintainer's machine. Signing (tools/release.ps1) stays local: the release
# key never touches CI. See docs/building.md, "Releases (maintainer)".

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: echod/go.sum

      - name: Version info
        id: ver
        run: |
          ref="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then ref="v0.0.0-dev"; fi
          echo "version=$ref" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Test
        working-directory: echod
        run: go test ./...

      - name: Build
        working-directory: echod
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
          CGO_ENABLED: "0"
        run: |
          pkg=github.com/HuskerMinion/techo5/echod/internal/layout
          ldflags="-s -w -X '$pkg.Version=${{ steps.ver.outputs.version }}' -X '$pkg.GitCommit=${{ steps.ver.outputs.commit }}' -X '$pkg.BuildDate=${{ steps.ver.outputs.date }}'"
          go build -trimpath -ldflags "$ldflags" -o ../bin/echod-arm ./cmd/echod
          go build -tags dot -trimpath -ldflags "$ldflags" -o ../bin/echod-arm-dot ./cmd/echod

      - name: Checksums
        working-directory: bin
        run: sha256sum echod-arm echod-arm-dot > SHA256SUMS

      # Cryptographically ties these two files to this exact workflow run and source commit (Sigstore,
      # keyless). Verify locally with: gh attestation verify bin/echod-arm --repo HuskerMinion/techo5
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            bin/echod-arm
            bin/echod-arm-dot

      - uses: actions/upload-artifact@v4
        with:
          name: techo5-${{ steps.ver.outputs.version }}
          path: |
            bin/echod-arm
            bin/echod-arm-dot
            bin/SHA256SUMS
          if-no-files-found: error
